name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install App Dependencies
        run: npm install

      - name: Build Web Application Bundle (Vite)
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Initialize Android Wrapper Project with Dynamic Build Number
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/ || true
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/java/com/sportsignal/app

          BUILD_NUM="${{ github.run_number }}"
          VERSION_NAME="1.0.${BUILD_NUM}"
          echo "Setting version: ${VERSION_NAME} (code: ${BUILD_NUM})"

          cat << 'EOF' > android/local.properties
          sdk.dir=/usr/local/lib/android/sdk
          EOF

          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SportSignal"
          include ':app'
          EOF

          cat << 'EOF' > android/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << EOF > android/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sportsignal.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sportsignal.app"
                  minSdk 24
                  targetSdk 34
                  versionCode ${BUILD_NUM}
                  versionName "${VERSION_NAME}"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">SportSignal AI</string>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/java/com/sportsignal/app/MainActivity.java
          package com.sportsignal.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Android APK (Debug)
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare Versioned APK Files
        run: |
          BUILD_NUM="${{ github.run_number }}"
          VERSION_NAME="1.0.${BUILD_NUM}"
          mkdir -p release-apk
          # Copy with versioned name so every release keeps its distinct file
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-apk/SportSignal-v${VERSION_NAME}-b${BUILD_NUM}.apk"
          # Also copy standard name for convenient one-click download
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/SportSignal-latest.apk
          echo "RELEASE_TAG=v1.0.${BUILD_NUM}" >> $GITHUB_ENV
          echo "RELEASE_NAME=SportSignal AI v1.0.${BUILD_NUM} (Build #${BUILD_NUM})" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportSignal-Android-APK
          path: release-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📱 SportSignal AI — Мобильное приложение для Android
            
            - **Версия:** `1.0.${{ github.run_number }}`
            - **Номер сборки (Build Code):** `${{ github.run_number }}`
            - **Ветка:** `${{ github.ref_name }}`
            - **Коммит:** `${{ github.sha }}`
            
            #### 📥 Файлы для установки:
            - **[Скачать SportSignal-v1.0.${{ github.run_number }}-b${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/SportSignal-v1.0.${{ github.run_number }}-b${{ github.run_number }}.apk)** — архивная версия сборки
            - **[Скачать SportSignal-latest.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/SportSignal-latest.apk)** — актуальная версия
            
            *Установка: разрешите установку из неизвестных источников в настройках Android и откройте скачанный `.apk` файл.*
          files: |
            release-apk/SportSignal-v1.0.${{ github.run_number }}-b${{ github.run_number }}.apk
            release-apk/SportSignal-latest.apk
